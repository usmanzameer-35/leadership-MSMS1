function landing(){return `<section class="hero"><div><div class="eyebrow">SZABIST · MS 5225</div><h1>Leadership that leaves evidence.</h1><p class="hero-copy">This course develops the capacity to understand yourself, influence others and lead meaningful organizational change. It connects leadership theory with motivation, human behaviour, research evidence and reflective practice.</p></div><aside class="journey"><div class="journey-label">Course progression</div><div class="journey-step"><b>1</b><div><strong>Leading self</strong><span>Awareness, values, motivation and emotional regulation</span></div></div><div class="journey-step"><b>2</b><div><strong>Leading others</strong><span>Influence, relationships, teams and development</span></div></div><div class="journey-step"><b>3</b><div><strong>Leading change</strong><span>Culture, innovation and organizational transformation</span></div></div></aside></section><div class="section-intro"><div><div class="kicker">Course workspace</div><h2>Choose where you want to work</h2></div><p>Move between focused sections in the same window. Use Course home at any time to return to this overview.</p></div><section class="modules"><a class="module featured" href="?view=course"><span class="number">01 · ORIENTATION</span><h3>Course Guide</h3><p>Official course outline, learning direction and semester context.</p><span class="open">Open section</span></a><a class="module" href="?view=textbooks"><span class="number">02 · FOUNDATIONS</span><h3>Textbooks</h3><p>Northouse and Yukl—the principal theoretical foundations for leadership analysis.</p><span class="open">Open section</span></a><a class="module" href="?view=research"><span class="number">03 · INQUIRY</span><h3>Assigned Tasks</h3><p>Research article, TED Talk presentation, individual critical analysis and book review.</p><span class="open">Open section</span></a><a class="module" href="?view=shared"><span class="number">04 · LIBRARY</span><h3>Shared by Instructor</h3><p>All uploaded course files—including the lecture deck and supporting profiles—in one searchable, downloadable library.</p><span class="open">Open section</span></a></section>`}
function course(){return `${head('01','Course Guide','The official course framework and 15-week learning journey for MS 5225 Leadership and Motivation Techniques.')}<section class="panel"><h2>Official course outline</h2><p>The course develops leadership in practice through leading self, leading others and leading change.</p>${resource(files.outline,'Official course document')}</section><section class="panel"><h2>Week-by-week course plan</h2><p>Select a week to see its focus, classroom activity and assessment point. The content below follows the official course-outline document.</p><div class="week-grid"><details class="week-card"><summary><span>Week 01</span><strong>Jumpstart: What Does It Mean to Be a Leader?</strong></summary><div class="week-body"><p><b>Focus:</b> Defining leadership in real life; leadership versus management; discovering your unique leadership style.</p><p><b>Learning activity:</b> Interactive group exercise: students share leadership experiences and strengths.</p><span class="week-assessment">Assessment: N/A</span></div></details><details class="week-card"><summary><span>Week 02</span><strong>The Building Blocks of Leadership</strong></summary><div class="week-body"><p><b>Focus:</b> From traits to actions; adapting leadership to situations; Goleman leadership styles; contingency leadership in practice.</p><p><b>Learning activity:</b> Small groups analyse leadership challenges and present solutions.</p><span class="week-assessment">Assessment: N/A</span></div></details><details class="week-card"><summary><span>Week 03</span><strong>Leading with Positivity: The Power of Positive Psychology</strong></summary><div class="week-body"><p><b>Focus:</b> Leading with strengths; inspiring others through optimism and hope.</p><p><b>Learning activity:</b> Leadership Positivity Workshop: assess leadership strengths and map an energized, positive team environment.</p><span class="week-assessment">Assessment: N/A</span></div></details><details class="week-card"><summary><span>Week 04</span><strong>Mastering Emotional Intelligence: Leading with Heart</strong></summary><div class="week-body"><p><b>Focus:</b> Leading with empathy; building emotional resilience as a leader.</p><p><b>Learning activity:</b> Emotional Intelligence Masterclass: role-play sensitive leadership situations with empathy and social awareness.</p><span class="week-assessment">Assessment: N/A</span></div></details><details class="week-card"><summary><span>Week 05</span><strong>The Dark Side of Leadership: What to Watch Out For</strong></summary><div class="week-body"><p><b>Focus:</b> Avoiding toxic leadership pitfalls; recognizing and preventing burnout in yourself and your team.</p><p><b>Learning activity:</b> Group role-play: identify and solve dilemmas involving toxic behaviours.</p><span class="week-assessment">Assessment: N/A</span></div></details><details class="week-card"><summary><span>Week 06</span><strong>Leadership in Action: Building High-Performing Teams</strong></summary><div class="week-body"><p><b>Focus:</b> Building trust and cooperation; resolving conflict to keep teams thriving.</p><p><b>Learning activity:</b> Team Challenge: solve a complex task while managing team dynamics and conflict in real time.</p><span class="week-assessment">Assessment: N/A</span></div></details><details class="week-card"><summary><span>Week 07</span><strong>Leading in Times of Crisis: Stay Calm and Lead On</strong></summary><div class="week-body"><p><b>Focus:</b> Crisis management; case studies of crisis leadership.</p><p><b>Learning activity:</b> Crisis Simulation: make real-time decisions under pressure while remaining calm, focused and inspiring.</p><span class="week-assessment">Assessment: Presentation 1</span></div></details><details class="week-card"><summary><span>Week 08</span><strong>Midterm Exam Week</strong></summary><div class="week-body"><p><b>Focus:</b> Practical leadership skills and key concepts from the first half of the course.</p><p><b>Learning activity:</b> Midterm examination.</p><span class="week-assessment">Assessment: Mid Term Paper</span></div></details><details class="week-card"><summary><span>Week 09</span><strong>Leading in a Digital World: The Future of Leadership</strong></summary><div class="week-body"><p><b>Focus:</b> Leading through digital transformation; how technology changes leadership.</p><p><b>Learning activity:</b> Research project: examine leaders who drove successful digital transformations and present the findings.</p><span class="week-assessment">Assessment: N/A</span></div></details><details class="week-card"><summary><span>Week 10</span><strong>Leading with AI & Data: Smarter Decisions for Smarter Leadership</strong></summary><div class="week-body"><p><b>Focus:</b> Using AI as a leadership tool; data-driven decision-making.</p><p><b>Learning activity:</b> Team case analysis: solve leadership challenges using AI and data-driven decisions.</p><span class="week-assessment">Assessment: N/A</span></div></details><details class="week-card"><summary><span>Week 11</span><strong>Inclusive Leadership: Building Diverse and Engaged Teams</strong></summary><div class="week-body"><p><b>Focus:</b> Leading a diverse workforce; cultivating belonging and respect.</p><p><b>Learning activity:</b> Diversity Workshop: discuss real-world challenges and develop strategies for inclusive teams.</p><span class="week-assessment">Assessment: N/A</span></div></details><details class="week-card"><summary><span>Week 12</span><strong>Innovation Leadership: Driving Creativity and Change</strong></summary><div class="week-body"><p><b>Focus:</b> Inspiring creative thinking; overcoming resistance to new ideas.</p><p><b>Learning activity:</b> Innovation Lab: teams design and pitch an innovative solution to a business challenge.</p><span class="week-assessment">Assessment: N/A</span></div></details><details class="week-card"><summary><span>Week 13</span><strong>Strategic Leadership: Leading with Vision and Purpose</strong></summary><div class="week-body"><p><b>Focus:</b> Setting a long-term vision; aligning leadership with organizational strategy.</p><p><b>Learning activity:</b> Strategy Simulation: create and present strategic plans aligned with long-term goals.</p><span class="week-assessment">Assessment: N/A</span></div></details><details class="week-card"><summary><span>Week 14</span><strong>Leading Change: Mastering the Art of Organizational Transformation</strong></summary><div class="week-body"><p><b>Focus:</b> Leading organizational transformation; managing resistance to change.</p><p><b>Learning activity:</b> Real-world change case: analyse an initiative and present solutions for successful transformation.</p><span class="week-assessment">Assessment: N/A</span></div></details><details class="week-card"><summary><span>Week 15</span><strong>Final Project Presentations</strong></summary><div class="week-body"><p><b>Focus:</b> Final project presentations.</p><p><b>Learning activity:</b> Students present their final projects.</p><span class="week-assessment">Assessment: Presentation 2</span></div></details></div></section>`}
function textbooks(){return `${head('02','Textbooks','Two complementary foundations: Northouse organizes major leadership approaches, while Yukl examines the processes through which leadership becomes effective.')}<div class="content-grid"><div><section class="panel"><h2>Core reading</h2><div class="resource-list">${resource(files.northouse,'Leadership theories · approaches · application')}${resource(files.yukl,'Influence · power · teams · decisions · change')}</div></section><section class="panel"><h2>How to use both books</h2><div class="group-grid"><div class="group"><div class="group-no">NORTHOUSE</div><h3>Map the theories</h3><p>Use its chapter structure to define, compare and critique leadership approaches in a consistent way.</p></div><div class="group"><div class="group-no">YUKL</div><h3>Examine effectiveness</h3><p>Use its research orientation to analyse influence, behaviour and the conditions that shape outcomes.</p></div></div></section></div><aside class="side-card"><h3>Reading lens</h3><p>For every concept, ask four questions.</p><ul><li>What does it claim?</li><li>What evidence supports it?</li><li>Where might it fail?</li><li>What would it look like in practice?</li></ul></aside></div>`}
function research(){return `${head('03','Assigned Tasks','All assessed work is organized here: the group research article, group TED Talk, individual TED critical analysis and individual book review.')}<section class="panel task-map-panel"><h2>Assigned task map</h2><p>Start by identifying whether the work belongs to a group or an individual. Select any task to open its full requirements below.</p><div class="task-map"><div class="task-root"><strong>MS 5225 Assigned Tasks</strong><span>Four tasks · two collaborative · two individual</span></div><svg class="task-connect" viewBox="0 0 800 92" role="img" aria-label="Assigned tasks divide into group and individual work" preserveAspectRatio="none"><defs><marker id="taskArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#168b82"/></marker></defs><path d="M400 0 V30 C400 48 210 42 210 84" fill="none" stroke="#168b82" stroke-width="3" marker-end="url(#taskArrow)"/><path d="M400 0 V30 C400 48 590 42 590 84" fill="none" stroke="#d7ad4a" stroke-width="3" marker-end="url(#taskArrow)"/></svg><div class="task-branches"><section class="task-branch"><div class="task-branch-head"><strong>Group work</strong><span>Collaborative</span></div><button class="task-node" data-open-task="article"><b>Research Article Presentation</b><small>Present the allocated article using only the instructor’s presentation format. Analyse the philosophy, design, findings and implications.</small><span class="task-output">Group presentation</span></button><button class="task-node" data-open-task="ted"><b>TED or TEDx Talk Presentation</b><small>Select one relevant talk. Present for 10–12 minutes, followed by 3–5 minutes of questions and discussion.</small><span class="task-output">8–10 content slides</span></button></section><section class="task-branch"><div class="task-branch-head"><strong>Individual work</strong><span>Independent</span></div><button class="task-node" data-open-task="analysis"><b>Critical Analysis of the TED Talk</b><small>Analyse the same talk presented by the group. Distinguish the speaker’s claims, academic evidence and your interpretation.</small><span class="task-output">1,500–2,000 words · APA 7</span></button><button class="task-node" data-open-task="book"><b>Book Review</b><small>Select an approved book related to leadership, motivation or human behaviour. Prepare both a presentation and written academic analysis.</small><span class="task-output">Individual presentation + paper</span></button></section></div><p class="task-map-note">Select a task card to move directly to its detailed instructions.</p></div></section><section class="panel"><h2>Assessment workspace</h2><p>Select a task below to view its format, responsibilities and supporting resources.</p><div class="assignment-tabs" role="tablist"><button class="tab active" data-tab="article">Research Article · Group</button><button class="tab" data-tab="ted">TED Talk · Group</button><button class="tab" data-tab="analysis">Critical Analysis · Individual</button><button class="tab" data-tab="book">Book Review · Individual</button></div><div class="tab-panel active" id="article"><div class="callout"><strong>Group task:</strong> prepare the allocated research article using only the instructor’s Article Presentation Format.</div><section class="panel"><h2>Required presentation format</h2><p>Use this document as the sole organizing guide for the research article presentation.</p>${resource(files.format,'Mandatory format for both research groups')}</section><section class="panel"><h2>Research groups</h2><div class="group-grid"><article class="group"><div class="group-no">GROUP 01</div><h3>The Great Disappearing Act</h3><p>${files.disappearing.summary}</p><div class="members"><span class="member">Eman Zia</span><span class="member">Rubab Sajid</span><span class="member">Sardar Hashim</span><span class="member">Nibras Mughal</span><span class="member">Samra Aslam</span></div>${resource(files.disappearing,'Alvesson & Sveningsson · 2003')}</article><article class="group"><div class="group-no">GROUP 02</div><h3>Positive Psychology Leadership Coaching</h3><p>${files.positive.summary}</p><div class="members"><span class="member">Zeeshan Sikander</span><span class="member">Usman Zameer</span><span class="member">Saira Abbasi</span><span class="member">Mehr un Nisa Shafiq</span><span class="member">Tahmina Ghaffar</span></div>${resource(files.positive,'Cilliers · 2011 · Qualitative research')}</article></div></section><section class="panel"><h2>Required analytical flow</h2><div class="chips"><span class="chip">Article identification</span><span class="chip">Problem and gap</span><span class="chip">Objectives and questions</span><span class="chip">Theory</span><span class="chip">Ontology</span><span class="chip">Epistemology</span><span class="chip">Paradigm</span><span class="chip">Qualitative design</span><span class="chip">Methods and sampling</span><span class="chip">Analysis</span><span class="chip">Findings</span><span class="chip">Critical evaluation</span></div></section></div><div class="tab-panel" id="ted">${resource(files.tedPresentation,'Official TED Talk presentation instructions')}<div class="callout"><strong>Group task:</strong> each group selects and presents one relevant TED or TEDx Talk.</div><div class="requirements"><div class="req"><strong>Presentation</strong><span>10–12 minutes</span></div><div class="req"><strong>Discussion</strong><span>3–5 minutes</span></div><div class="req"><strong>Content slides</strong><span>Approximately 8–10</span></div><div class="req"><strong>Evidence</strong><span>Credible academic sources</span></div></div><ol class="outline"><li><div><b>Title</b><span>Talk, speaker, group details and course</span></div></li><li><div><b>Speaker and context</b><span>Background, video link and duration</span></div></li><li><div><b>Central theme</b><span>Problem, purpose and core message</span></div></li><li><div><b>Main ideas</b><span>Three to five ideas with examples or evidence</span></div></li><li><div><b>Leadership and motivation concepts</b><span>Connect the talk with relevant theories</span></div></li><li><div><b>Critical analysis</b><span>Evidence, assumptions, limitations and applicability</span></div></li><li><div><b>Practical applications</b><span>At least two specific applications</span></div></li><li><div><b>Learning and reflection</b><span>Three lessons and potential actions</span></div></li><li><div><b>Conclusion</b><span>Relevance and one central takeaway</span></div></li><li><div><b>References</b><span>TED Talk and academic sources in APA 7</span></div></li></ol></div><div class="tab-panel" id="analysis">${resource(files.tedAssignment,'Official written critical-analysis instructions')}<div class="callout"><strong>Individual task:</strong> submit an academic analysis of the same TED or TEDx Talk presented by the group.</div><div class="requirements"><div class="req"><strong>Length</strong><span>1,500–2,000 words</span></div><div class="req"><strong>Sources</strong><span>At least five academic sources</span></div><div class="req"><strong>Referencing</strong><span>APA 7th edition</span></div><div class="req"><strong>Format</strong><span>Word document or PDF</span></div></div><ol class="outline"><li><div><b>Cover page</b><span>University and department; course and assignment titles; TED Talk and speaker; student details; instructor; submission date</span></div></li><li><div><b>Introduction</b><span>150–200 words</span></div></li><li><div><b>Speaker background and context</b><span>100–150 words</span></div></li><li><div><b>Summary of the TED Talk</b><span>250–350 words</span></div></li><li><div><b>Leadership and motivation concepts</b><span>300–400 words; at least two theories</span></div></li><li><div><b>Critical evaluation</b><span>250–350 words</span></div></li><li><div><b>Practical applications</b><span>200–300 words; at least two examples</span></div></li><li><div><b>Personal reflection</b><span>150–200 words</span></div></li><li><div><b>Conclusion</b><span>100–150 words</span></div></li><li><div><b>References</b><span>APA 7th edition</span></div></li><li><div><b>Appendix</b><span>Optional supplementary material</span></div></li></ol><p><strong>Academic distinction:</strong> clearly separate what the speaker claims, what academic theory and research suggest, and your own critical interpretation.</p></div><div class="tab-panel" id="book"><div class="callout"><strong>Individual task:</strong> choose a book connected to human behaviour, organizational performance, personal development or a related subject, and submit its title to the instructor.</div><h3>Two connected outputs</h3><p>Prepare an individual book-review presentation and a written academic analysis of the same book. The presentation should explain the book’s central argument, key ideas, leadership and motivation connections, critical assessment, applications and personal learning. The written analysis should develop those ideas as coherent academic prose rather than reproducing the slides.</p><div class="chips"><span class="chip">Individual presentation</span><span class="chip">Individual written analysis</span><span class="chip">Academic evidence</span><span class="chip">Critical reflection</span></div></div></section>`}
function shared(){const all=Object.values(files).map(f=>resource(f)).join('');return `${head('04','Shared by Instructor','Every uploaded course resource—including lecture materials and supporting profiles—is collected here. Search by title or topic, filter by file type and download the original file.')}<section class="panel"><div class="searchbar"><input id="search" type="search" placeholder="Search files, topics or summaries…" aria-label="Search instructor files"></div><div class="filter-row"><button class="filter active" data-filter="all">All files</button><button class="filter" data-filter="PDF">PDF</button><button class="filter" data-filter="DOCX">DOCX</button><button class="filter" data-filter="PPTX">PPTX</button><button class="filter" data-filter="TXT">Instructions</button><button class="filter" data-filter="IMAGE">Images</button></div><div class="resource-list" id="library">${all}</div><div class="empty" id="empty">No resources match your search.</div></section>`}
const views={course,textbooks,research,shared};
const params=new URLSearchParams(location.search);const view=params.get('view');document.getElementById('app').innerHTML=views[view]?views[view]():landing();
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab-panel').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById(btn.dataset.tab).classList.add('active')}));
document.querySelectorAll('[data-open-task]').forEach(node=>node.addEventListener('click',()=>{const tab=document.querySelector(`.tab[data-tab="${node.dataset.openTask}"]`);if(tab){tab.click();document.querySelector('.assignment-tabs')?.scrollIntoView({behavior:'smooth',block:'center'})}}));
let currentFilter='all';function filterLibrary(){const q=(document.getElementById('search')?.value||'').toLowerCase();let shown=0;document.querySelectorAll('#library .resource').forEach(el=>{const ok=(currentFilter==='all'||el.dataset.type===currentFilter)&&el.dataset.search.includes(q);el.style.display=ok?'grid':'none';if(ok)shown++});const empty=document.getElementById('empty');if(empty)empty.style.display=shown?'none':'block'}
document.getElementById('search')?.addEventListener('input',filterLibrary);document.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));btn.classList.add('active');currentFilter=btn.dataset.filter;filterLibrary()}));
</script>
